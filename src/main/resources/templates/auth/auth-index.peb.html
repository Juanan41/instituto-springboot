<!DOCTYPE html>
<html lang="{{ lang | default('es') }}">

{% include "fragments/head" %}

<body class="bg-auth">
<div class="page-overlay">

{% include "fragments/navbar" %}

<div class="container py-4">

    <div class="card shadow-sm border-0 rounded-4">
        <div class="card-header bg-dark text-white rounded-top-4">
            <h2 class="h5 mb-0">🔐 Acceso</h2>
        </div>

        <div class="card-body p-4">
            <p class="text-muted mb-4">
                Si ya tienes cuenta inicia sesión, si no regístrate.
            </p>

            <div class="d-flex gap-3">
                <a class="btn btn-success rounded-4 px-4" href="/public/auth/login?lang={{ lang }}">
                    <i class="bi bi-box-arrow-in-right me-2"></i> Iniciar sesión
                </a>

                <a class="btn btn-outline-primary rounded-4 px-4" href="/public/auth/register?lang={{ lang }}">
                    <i class="bi bi-person-plus me-2"></i> Registrarse
                </a>
            </div>
        </div>
    </div>

</div>
</div>

{% include "fragments/scripts" %}
</body>
</html>
