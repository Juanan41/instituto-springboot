<!DOCTYPE html>
<html lang="{{ lang | default('es') }}">

{% include "fragments/head" %}

<body class="bg-auth">
{% include "fragments/navbar" %}

<div class="container py-4">

    <div class="card shadow-sm border-0 rounded-4">
        <div class="card-header bg-primary text-white rounded-top-4">
            <h2 class="h5 mb-0">📝 Registro</h2>
        </div>

        <div class="card-body p-4">

            {% if msgError %}
            <div class="alert alert-danger rounded-4">{{ msgError }}</div>
            {% endif %}

            <form method="post" action="/public/auth/register">
                <input type="hidden" name="lang" value="{{ lang | default('es') }}">

                <div class="mb-3">
                    <label class="form-label fw-semibold">Usuario</label>
                    <input class="form-control" type="text" name="username" required>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Email</label>
                    <input class="form-control" type="email" name="email" required>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Contraseña</label>
                    <input class="form-control" type="password" name="password" required>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Repite contraseña</label>
                    <input class="form-control" type="password" name="password2" required>
                </div>

                <div class="d-flex gap-2 mt-4">
                    <button class="btn btn-primary" type="submit">
                        <i class="bi bi-person-plus me-1"></i> Crear cuenta
                    </button>

                    <a href="/public/auth/login?lang={{ lang }}" class="btn btn-outline-success">
                        Ya tengo cuenta
                    </a>

                    <a href="/public?lang={{ lang }}" class="btn btn-outline-secondary">
                        Volver
                    </a>
                </div>
            </form>

        </div>
    </div>

</div>

{% include "fragments/scripts" %}
</body>
</html>
