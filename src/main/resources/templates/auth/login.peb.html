<!DOCTYPE html>
<html lang="{{ lang | default('es') }}">

{% include "fragments/head" %}

<body class="bg-auth">
{% include "fragments/navbar" %}

<div class="container py-4">



    <div class="card shadow-sm border-0 rounded-4">
        <div class="card-header bg-success text-white rounded-top-4">
            <h2 class="h5 mb-0">🔑 Iniciar sesión</h2>
        </div>

        <div class="card-body p-4">

            {% if param.error %}
            <div class="alert alert-danger rounded-4">
                Usuario o contraseña incorrectos
            </div>
            {% endif %}

            {% if param.logout %}
            <div class="alert alert-success rounded-4">
                Has cerrado sesión correctamente
            </div>
            {% endif %}


            <form method="post" action="/public/auth/login">
            <input type="hidden" name="lang" value="{{ lang | default('es') }}">

                <div class="mb-3">
                    <label class="form-label fw-semibold">Usuario o email</label>
                    <input class="form-control" type="text" name="username" required>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Contraseña</label>
                    <input class="form-control" type="password" name="password" required>
                </div>

                <div class="d-flex gap-2 mt-4">
                    <button class="btn btn-success" type="submit">
                        <i class="bi bi-check-circle me-1"></i> Entrar
                    </button>

                    <a href="/public/auth/register?lang={{ lang }}" class="btn btn-outline-primary">
                        Registrarse
                    </a>

                    <a href="/public?lang={{ lang }}" class="btn btn-outline-secondary">
                        Volver
                    </a>
                </div>
            </form>

        </div>
    </div>

</div>

{% include "fragments/scripts" %}
</body>
</html>
