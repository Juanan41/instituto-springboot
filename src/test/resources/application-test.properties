# src/test/resources/application-test.properties

# 1. Fuerza la recreaci\u00F3n del esquema DDL (la tabla INSTITUTOS)
spring.jpa.hibernate.ddl-auto=create-drop


# *** INCONSISTENCIA FINAL RESUELTA AQU\u00CD: ***
# 1a. Forzamos a Hibernate a usar las comillas dobles ("email") para conservar el caso.
#spring.jpa.properties.hibernate.globally_quoted_identifiers=true
# 1b. Le decimos a H2 que respete las min\u00FAsculas y se comporte como PostgreSQL.
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL

# 2. Fuerza la carga de datos (data.sql)
spring.sql.init.mode=never
spring.sql.init.data-locations=classpath:data.sql

# 3. Define la URL de la base de datos de tests (H2 en memoria)
spring.datasource.username=sa
spring.datasource.password=password
spring.datasource.driverClassName=org.h2.Driver
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

